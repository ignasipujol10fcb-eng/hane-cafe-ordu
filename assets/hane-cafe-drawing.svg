<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf1df"/><stop offset=".55" stop-color="#ead3ae"/><stop offset="1" stop-color="#c99b67"/></linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9b6841"/><stop offset="1" stop-color="#5b3725"/></linearGradient>
 <linearGradient id="choc" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7b472d"/><stop offset="1" stop-color="#402318"/></linearGradient>
 <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8e9"/><stop offset="1" stop-color="#e8cfa9"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff8e8" stop-opacity=".9"/><stop offset="1" stop-color="#fff8e8" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
